[workspace]
resolver = "2"
members = ["crates/core", "crates/github", "crates/server", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/teloverge/stellr"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
